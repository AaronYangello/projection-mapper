[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "projection-show"
version = "0.3.0"
description = "A configurable native projection show engine with live mapping and media"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "PyYAML>=6,<7", "moderngl>=5.12,<6", "glfw>=2.8,<3", "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "av>=16,<18",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
compiler = ["imageio-ffmpeg>=0.6,<0.7"]
appliance = ["PyOpenGL>=3.1.9,<4", "PyGObject>=3.42,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "PyOpenGL>=3.1.9,<4"]

[project.scripts]
projection-show = "projection_show.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a working native graphics context and display", "gst: requires installed GStreamer and PyGObject"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
